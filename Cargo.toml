[package]
name = "hexforge-server"
version = "0.1.0"
edition = "2021"
description = "Serveur distant HEXFORGE Lab : /api/ping + WebSocket JSON-RPC exec (js/lua/java/rust/html)"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
